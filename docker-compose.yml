services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs Celery tasks: emails, and whatever beat schedules.
  worker:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment: &app-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:postgres@db:5432/booking
      REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on: &app-deps
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The scheduler: sends periodic tasks to the worker. Exactly one must run,
  # however many workers there are, or every periodic task runs twice.
  beat:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    # Schedule state goes to /tmp so it isn't written into the mounted repo.
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
    environment: *app-env
    env_file:
      - path: .env
        required: false
    depends_on: *app-deps

  css:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-dev.txt
    # Rebuild static/css/app.css whenever a template changes. --watch=always
    # keeps watching even though compose gives the process no stdin.
    command: tailwindcss -i assets/app.css -o static/css/app.css --watch=always
    volumes:
      - .:/app

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d booking"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
