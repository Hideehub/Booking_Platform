name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/booking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy .

      # Fails if a model change has no migration. The tests build their database
      # from the models' migrations, so they wouldn't catch this on their own.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

      # The image Render deploys: catches a broken Dockerfile, a failing
      # Tailwind build or a static file collectstatic can't process.
      - name: Build production image
        run: docker build -t booking-platform:ci .
